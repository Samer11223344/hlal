<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الهلال الأحمر | Davis Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .red-gradient { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); }
        .admin-glow { border-color: #3b82f6 !important; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div id="userHeader" class="hidden w-full max-w-5xl flex justify-between items-center mb-8 p-4 glass rounded-2xl">
        <div class="flex items-center gap-4">
            <img id="userAvatar" src="" class="w-12 h-12 rounded-full border-2 border-red-500 shadow-lg shadow-red-500/20">
            <div>
                <p class="text-xs text-gray-400">مرحباً بك،</p>
                <p id="userName" class="font-bold text-lg text-white">جاري التحميل...</p>
            </div>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/10 text-red-500 px-4 py-2 rounded-lg hover:bg-red-500 transition">تسجيل خروج</button>
    </div>

    <div id="loginSection" class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl mt-20 border-t-4 border-red-600">
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-red-600/20 mb-4 animate-pulse text-4xl">🚑</div>
            <h2 class="text-2xl font-bold">بوابة الهلال الأحمر</h2>
            <p class="text-gray-400 text-sm mt-2">يرجى تسجيل الدخول عبر ديسكورد</p>
        </div>
        <button onclick="discordLogin()" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-3 transition-all">
            <span>تسجيل الدخول بالديسكورد</span>
        </button>
    </div>

    <div id="codeSection" class="hidden glass p-8 rounded-3xl w-full max-w-md shadow-2xl mt-20">
        <h2 class="text-xl font-bold text-center mb-6 underline underline-offset-8 decoration-red-500">التحقق العسكري</h2>
        <input type="password" id="staffCode" placeholder="أدخل الرمز (11011)" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-xl tracking-[10px] focus:border-red-500 outline-none mb-4 transition-all">
        <button onclick="checkAccess()" class="w-full red-gradient py-4 rounded-xl font-bold shadow-lg shadow-red-500/20">دخول المنصة</button>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl border-r-4 border-green-500">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">📅 سجل الحضور</h3>
                <button onclick="sendPresence('حضور ✅')" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold mb-2 transition-all">تسجيل حضور</button>
                <button onclick="sendPresence('انصراف ❌')" class="w-full border border-red-500/50 hover:bg-red-500/20 py-3 rounded-xl font-bold transition-all">تسجيل انصراف</button>
            </div>

            <div id="adminPanel" class="glass p-6 rounded-2xl border-r-4 border-blue-500 opacity-40 pointer-events-none transition-all duration-500">
                <h3 class="text-xl font-bold mb-4 text-blue-400">🛡️ إدارة الموظفين</h3>
                <button onclick="addNewStaff()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold">إضافة كادر طبي جديد</button>
                <p class="text-[10px] mt-2 text-center text-gray-400">صلاحية المسؤول: 1455665513286860820</p>
            </div>

            <div class="glass p-6 rounded-2xl border-r-4 border-yellow-500 flex flex-col justify-center items-center">
                <p class="text-gray-400 text-sm">حالة الربط</p>
                <p class="text-2xl font-bold text-yellow-500">متصل 🟢</p>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-4 bg-white/5 font-bold border-b border-white/10 flex justify-between items-center text-red-500">
                <span>قائمة الكادر الطبي (Davis Server)</span>
                <span id="staffCount" class="bg-red-500/20 px-2 py-1 rounded text-xs">1 موظف</span>
            </div>
            <table class="w-full text-right">
                <thead class="bg-white/5 text-gray-400 text-sm">
                    <tr><th class="p-4">اسم الموظف</th><th class="p-4">الرتبة</th><th class="p-4 text-left">التاريخ</th></tr>
                </thead>
                <tbody id="staffTableBody">
                    <tr class="border-t border-white/5">
                        <td class="p-4 font-bold">سامر القحطاني</td>
                        <td class="p-4"><span class="bg-red-500/20 text-red-500 px-3 py-1 rounded-full text-[10px] font-bold">مدير القطاع</span></td>
                        <td class="p-4 text-left text-xs text-gray-500">أساسي</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- إعداداتك الخاصة ---
        const CLIENT_ID = '1385857180036632577';
        // تم وضع رابط الويب هوك الخاص بروم الحضور (1413033178540539958)
        const WEBHOOK_URL = 'https://discordapp.com/api/webhooks/1455673493571113092/u1bo8mSUeVAKESMe1b2LYadcbiU0m9LEhgBrM9Vjl4qyq9qJRQozr_lqpcGpRZ7UzOfu'; // ملاحظة: يجب أن تضع "Token" الويب هوك الخاص بك هنا ليعمل فعلياً
        const REDIRECT_URI = encodeURIComponent(window.location.href.split('#')[0]);

        function discordLogin() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;
        }

        window.onload = () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');
            if (token) {
                fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } })
                .then(res => res.json())
                .then(user => {
                    sessionStorage.setItem('discord_user', JSON.stringify(user));
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('codeSection').classList.remove('hidden');
                    document.getElementById('userHeader').classList.remove('hidden');
                    document.getElementById('userName').innerText = user.username;
                    document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                });
            }
        };

        function checkAccess() {
            if(document.getElementById('staffCode').value === "11011") {
                document.getElementById('codeSection').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('adminPanel').classList.remove('opacity-40', 'pointer-events-none');
                document.getElementById('adminPanel').classList.add('admin-glow');
            } else { alert("الرمز العسكري غير صحيح!"); }
        }

        async function sendPresence(status) {
            const user = JSON.parse(sessionStorage.getItem('discord_user'));
            const payload = {
                embeds: [{
                    title: "🚑 بلاغ عملياتي | الهلال الأحمر",
                    description: `الموظف: **${user.username}**\nالإجراء: **${status}**`,
                    color: status.includes('حضور') ? 0x2ecc71 : 0xe74c3c,
                    footer: { text: "نظام Davis للتحكم" },
                    timestamp: new Date(),
                    thumbnail: { url: `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` }
                }]
            };
            
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                alert("تم إرسال السجل إلى روم الحضور بنجاح ✅");
            } catch (e) {
                alert("خطأ: تأكد من وضع رابط الويب هوك بشكل صحيح");
            }
        }

        function addNewStaff() {
            const name = prompt("اسم الموظف الجديد:");
            const rank = prompt("الرتبة:");
            if(name && rank) {
                const table = document.getElementById('staffTableBody');
                table.innerHTML += `
                    <tr class="border-t border-white/5 hover:bg-white/10 transition">
                        <td class="p-4 font-bold text-blue-400">${name}</td>
                        <td class="p-4"><span class="bg-blue-500/20 text-blue-500 px-3 py-1 rounded-full text-[10px] font-bold">${rank}</span></td>
                        <td class="p-4 text-left text-xs text-gray-500">${new Date().toLocaleDateString('ar-SA')}</td>
                    </tr>`;
                document.getElementById('staffCount').innerText = `${table.getElementsByTagName('tr').length} موظفين`;
                logToDiscord(`إضافة موظف: ${name} رتبة: ${rank}`);
            }
        }

        async function logToDiscord(msg) {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: `🛡️ **إشعار إداري:** ${msg}` })
            });
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = window.location.href.split('#')[0];
        }
    </script>
</body>
</html>
