<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davis Hub | التحكم المركزي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red-main: #ff4655; --blue-main: #3b82f6; --glass-bg: rgba(10, 10, 10, 0.9); }
        body { font-family: 'Cairo', sans-serif; background: #000; color: white; overflow-x: hidden; }
        
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .neon-border { border: 1px solid rgba(255, 70, 85, 0.2); transition: 0.3s; }
        .neon-border:hover { border-color: var(--red-main); box-shadow: 0 0 20px rgba(255, 70, 85, 0.1); }
        
        input[type="checkbox"]:checked + .rank-label { 
            background: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%); 
            color: white; border-color: transparent; transform: scale(0.95);
        }

        .locked { filter: grayscale(1) blur(2px); cursor: not-allowed !important; opacity: 0.5; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-active { display: flex; animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .user-search-card { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen">

    <nav id="navbar" class="hidden p-6 glass-panel sticky top-0 z-50 flex justify-between items-center px-12 border-b border-red-500/20">
        <div class="flex items-center gap-6">
            <div class="relative">
                <img id="userAvatar" class="w-14 h-14 rounded-2xl object-cover border-2 border-red-500">
                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-black"></div>
            </div>
            <div>
                <h2 id="userName" class="text-xl font-black tracking-tighter uppercase"></h2>
                <span class="text-[10px] bg-red-500/20 text-red-500 px-2 py-0.5 rounded font-bold italic tracking-widest">AUTHORIZED OPERATOR</span>
            </div>
        </div>
        <button onclick="logout()" class="text-gray-400 hover:text-red-500 transition font-bold text-xs border border-white/10 px-4 py-2 rounded-lg">تسجيل الخروج</button>
    </nav>

    <section id="loginSection" class="h-screen flex items-center justify-center p-6 relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-red-900/20 via-black to-black"></div>
        <div class="glass-panel p-16 rounded-[60px] max-w-xl w-full text-center relative z-10 border-t-4 border-red-600 shadow-2xl">
            <h1 class="text-8xl font-black mb-4 tracking-tighter">DAVIS<span class="text-red-600">.</span></h1>
            <p class="text-gray-400 mb-12 font-medium tracking-widest uppercase text-xs">Integrated Operations Center</p>
            <button onclick="discordLogin()" class="w-full bg-white text-black hover:bg-red-600 hover:text-white py-6 rounded-3xl font-black text-xl transition-all shadow-xl shadow-white/5 flex items-center justify-center gap-4">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.125-.094.252-.192.37-.29a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.196.373.29a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                دخول النظام المركزي
            </button>
        </div>
    </section>

    <section id="sectorSection" class="hidden min-h-screen p-12">
        <div class="max-w-7xl mx-auto">
            <h3 class="text-5xl font-black tracking-tighter mb-12 italic border-r-4 border-red-600 pr-6">SECTORS_</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div id="card_red_crescent" onclick="enterSector('red_crescent')" class="neon-border glass-panel p-10 rounded-[40px] relative group cursor-pointer overflow-hidden">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🚑</div>
                    <h4 class="text-2xl font-black">الهلال الأحمر</h4>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">Medical Authority</p>
                    <div id="lockIcon" class="absolute top-6 left-6 text-red-600 font-black text-[10px]">ACCESS DENIED</div>
                </div>
                <div class="locked glass-panel p-10 rounded-[40px] opacity-20"><div class="text-7xl mb-6">🛡️</div><h4 class="text-2xl font-black italic">Security</h4></div>
                <div class="locked glass-panel p-10 rounded-[40px] opacity-20"><div class="text-7xl mb-6">⚙️</div><h4 class="text-2xl font-black italic">Garage</h4></div>
                <div class="locked glass-panel p-10 rounded-[40px] opacity-20"><div class="text-7xl mb-6">🛰️</div><h4 class="text-2xl font-black italic">Border</h4></div>
            </div>
        </div>
    </section>

    <section id="redCrescentDashboard" class="hidden p-8 max-w-7xl mx-auto space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 glass-panel p-12 rounded-[50px] border-r-8 border-green-600 shadow-2xl">
                <h3 class="text-4xl font-black mb-10 italic tracking-tighter">OPERATIONS_</h3>
                <div class="grid grid-cols-2 gap-8">
                    <button onclick="sendLog('ON_DUTY ✅')" class="bg-green-600/10 hover:bg-green-600 border border-green-500/20 text-green-500 hover:text-white py-14 rounded-[40px] font-black text-3xl transition-all">حضور</button>
                    <button onclick="sendLog('OFF_DUTY ❌')" class="bg-red-600/10 hover:bg-red-600 border border-red-500/20 text-red-500 hover:text-white py-14 rounded-[40px] font-black text-3xl transition-all">انصراف</button>
                </div>
            </div>

            <div id="recruitmentPanel" class="hidden glass-panel p-10 rounded-[50px] border-t-8 border-blue-600 flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 bg-blue-600/10 rounded-full flex items-center justify-center text-5xl mb-6 shadow-2xl">📝</div>
                <h3 class="text-2xl font-black mb-4 tracking-tighter italic">RECRUITMENT</h3>
                <button onclick="openModal()" class="w-full bg-blue-600 hover:bg-blue-700 py-6 rounded-3xl font-black text-white transition-all shadow-xl shadow-blue-900/40">إدارة التوظيف</button>
            </div>
        </div>
    </section>

    <div id="recruitModal" class="modal-overlay">
        <div class="glass-panel w-full max-w-4xl p-12 rounded-[60px] max-h-[90vh] overflow-y-auto border border-blue-500/30">
            <div class="flex justify-between items-center mb-12">
                <h2 class="text-4xl font-black tracking-tighter italic border-r-4 border-blue-600 pr-6">SYSTEM_APPOINTMENT</h2>
                <button onclick="closeModal()" class="text-3xl text-gray-500 hover:text-white transition">&times;</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="space-y-6 border-l border-white/5 pl-6">
                    <div>
                        <label class="block text-[10px] font-black text-blue-500 mb-3 tracking-[4px]">STEP 01: IDENTIFY USER</label>
                        <div class="flex gap-2">
                            <input type="text" id="targetDiscord" placeholder="Discord ID..." class="flex-1 bg-white/5 border border-white/10 p-5 rounded-2xl focus:outline-none focus:border-blue-500 font-bold">
                            <button onclick="searchUser()" class="bg-blue-600 px-6 rounded-2xl hover:bg-blue-500 transition shadow-lg shadow-blue-600/20 font-black">بحث</button>
                        </div>
                    </div>

                    <div id="userResult" class="hidden user-search-card bg-white/5 p-6 rounded-3xl flex items-center gap-4 border border-blue-500/20">
                        <img id="resAvatar" class="w-16 h-16 rounded-full border-2 border-blue-500">
                        <div>
                            <p id="resName" class="font-black text-lg"></p>
                            <p id="resID" class="text-[10px] text-gray-500"></p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-blue-500 mb-3 tracking-[4px]">STEP 02: ASSIGN IDENTITY</label>
                        <input type="text" id="staffName" placeholder="الاسم الحقيقي (ثلاثي)..." class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl focus:outline-none focus:border-blue-500 font-bold mb-4">
                        <input type="text" id="playerID" placeholder="كود اللاعب (مثال: 505)..." class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl focus:outline-none focus:border-blue-500 font-black text-center text-xl">
                    </div>
                </div>

                <div class="space-y-6">
                    <label class="block text-[10px] font-black text-blue-500 mb-3 tracking-[4px]">STEP 03: DEFINE ROLES</label>
                    <div class="grid grid-cols-2 gap-3 max-h-[400px] overflow-y-auto pr-2" id="ranksList">
                        </div>
                </div>
            </div>

            <button onclick="processRecruit()" id="confirmBtn" class="w-full mt-12 bg-blue-600 hover:bg-blue-500 py-6 rounded-[30px] font-black text-2xl shadow-2xl shadow-blue-600/30 transition-all hover:scale-[1.01] active:scale-95">
                تفعيل التوظيف (تعديل ديسكورد) 🚀
            </button>
        </div>
    </div>

    <script>
        const CONFIG = {
            CLIENT_ID: '1385857180036632577',
            GUILD_ID: '1385853276485845084',
            // ضع توكن البوت هنا ليعمل تغيير الرتب والأسماء فوراً (سرية تامة)
            BOT_TOKEN: 'YOUR_BOT_TOKEN_HERE', 
            WEBHOOKS: {
                LOGS: 'https://discordapp.com/api/webhooks/1455673493571113092/u1bo8mSUeVAKESMe1b2LYadcbiU0m9LEhgBrM9Vjl4qyq9qJRQozr_lqpcGpRZ7UzOfu',
                RECRUIT: 'https://discordapp.com/api/webhooks/1455674711110451358/BJiZOQ3b-butqHiOdyeKnjSPnKzjXhXzhKu5QOSlvPlHsnpQQuYFMJUh9-BB4TbI4iOc'
            },
            RANKS: [
                {id: "1448772434940395621", name: "إدارة الهلال"},
                {id: "1402752457796485233", name: "متدرب"},
                {id: "1402752591770943508", name: "مستوى 1"},
                {id: "1402752748289790094", name: "مستوى 2"},
                {id: "1402753188825927863", name: "مستوى 3"},
                {id: "1402753258799235164", name: "مستوى 4"},
                {id: "1402753361857609728", name: "مستوى 5"},
                {id: "1402753401678463096", name: "مستوى 6"},
                {id: "1402753452274225273", name: "مستوى 7"},
                {id: "1402753505642545422", name: "مستوى 8"},
                {id: "1402753555701432482", name: "مستوى 9"},
                {id: "1455659626174480568", name: "إشراف عام"},
                {id: "1455659784370917436", name: "إشراف ميداني"},
                {id: "1455665513286860820", name: "مسؤول توظيف"},
                {id: "1455659406132904049", name: "شؤون الهلال"},
                {id: "1402753610529505433", name: "نائب الهلال"},
                {id: "1402753839517536288", name: "قائد الهلال"}
            ]
        };

        let userRoles = [];

        function discordLogin() {
            const uri = encodeURIComponent(window.location.href.split('#')[0]);
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.CLIENT_ID}&redirect_uri=${uri}&response_type=token&scope=identify+guilds.members.read`;
        }

        window.onload = async () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');
            if (token) {
                const res = await fetch(`https://discord.com/api/users/@me/guilds/${CONFIG.GUILD_ID}/member`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.user) {
                    userRoles = data.roles || [];
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    renderApp();
                }
            }
        };

        function renderApp() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('sectorSection').classList.remove('hidden');
            document.getElementById('userName').innerText = user.username;
            document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

            if (userRoles.includes("1448772434940395621") || userRoles.includes("1455665513286860820")) {
                document.getElementById('card_red_crescent').classList.remove('locked');
                document.getElementById('lockIcon').innerHTML = "ACCESS GRANTED";
                document.getElementById('lockIcon').classList.replace('text-red-600', 'text-green-500');
            }
        }

        async function searchUser() {
            const id = document.getElementById('targetDiscord').value;
            if (!id) return alert("ادخل آيدي الديسكورد");
            
            // استخدام البوت لجلب بيانات اللاعب فوراً
            const res = await fetch(`https://discord.com/api/guilds/${CONFIG.GUILD_ID}/members/${id}`, {
                headers: { Authorization: `Bot ${CONFIG.BOT_TOKEN}` }
            });
            const data = await res.json();
            
            if (data.user) {
                document.getElementById('userResult').classList.remove('hidden');
                document.getElementById('resName').innerText = data.nick || data.user.username;
                document.getElementById('resID').innerText = data.user.id;
                document.getElementById('resAvatar').src = `https://cdn.discordapp.com/avatars/${data.user.id}/${data.user.avatar}.png`;
            } else {
                alert("المستخدم غير موجود بالسيرفر!");
            }
        }

        function enterSector(sector) {
            document.getElementById('sectorSection').classList.add('hidden');
            document.getElementById('redCrescentDashboard').classList.remove('hidden');
            if (userRoles.includes("1455665513286860820") || userRoles.includes("1448772434940395621")) {
                document.getElementById('recruitmentPanel').classList.remove('hidden');
            }
            const list = document.getElementById('ranksList');
            list.innerHTML = CONFIG.RANKS.map(r => `
                <div class="relative">
                    <input type="checkbox" id="r_${r.id}" value="${r.name}" data-id="${r.id}" class="hidden rank-cb">
                    <label for="r_${r.id}" class="rank-label block p-4 border border-white/10 rounded-2xl text-[10px] font-black text-center cursor-pointer hover:bg-white/5 transition-all truncate uppercase tracking-tighter">
                        ${r.name}
                    </label>
                </div>
            `).join('');
        }

        async function processRecruit() {
            const targetID = document.getElementById('targetDiscord').value;
            const staffName = document.getElementById('staffName').value;
            const playerID = document.getElementById('playerID').value;
            const selectedRanks = Array.from(document.querySelectorAll('.rank-cb:checked')).map(cb => cb.getAttribute('data-id'));
            const selectedRankNames = Array.from(document.querySelectorAll('.rank-cb:checked')).map(cb => cb.value);
            const admin = JSON.parse(sessionStorage.getItem('user'));

            if(!targetID || !staffName || !playerID || selectedRanks.length === 0) return alert("اكمل جميع البيانات وحدد الرتب!");

            document.getElementById('confirmBtn').innerText = "جاري المعالجة...";

            try {
                // 1. تحديث الاسم (Nickname) في ديسكورد
                const newNick = `${playerID} | ${staffName}`;
                await fetch(`https://discord.com/api/guilds/${CONFIG.GUILD_ID}/members/${targetID}`, {
                    method: 'PATCH',
                    headers: { 
                        Authorization: `Bot ${CONFIG.BOT_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nick: newNick, roles: selectedRanks })
                });

                // 2. إرسال سجل التوظيف (Webhook)
                const embed = {
                    title: "📜 قرار إداري: توظيف وتعديل منصب",
                    color: 0x3b82f6,
                    fields: [
                        { name: "👤 الموظف", value: `<@${targetID}>`, inline: true },
                        { name: "🔢 الكود", value: `\`${playerID}\``, inline: true },
                        { name: "🎖️ الرتب", value: selectedRankNames.join(' - '), inline: false },
                        { name: "✍️ المسؤول", value: admin.username, inline: true }
                    ],
                    footer: { text: "Davis System Automation" },
                    timestamp: new Date()
                };

                await fetch(CONFIG.WEBHOOKS.RECRUIT, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ embeds: [embed] })
                });

                alert("✅ تم التوظيف بنجاح! تم تغيير الاسم ومنح الرتب في الديسكورد.");
                closeModal();
            } catch (error) {
                alert("حدث خطأ أثناء الاتصال بديسكورد. تأكد من صلاحيات البوت.");
            }
            document.getElementById('confirmBtn').innerText = "تفعيل التوظيف (تعديل ديسكورد) 🚀";
        }

        function openModal() { document.getElementById('recruitModal').classList.add('modal-active'); }
        function closeModal() { document.getElementById('recruitModal').classList.remove('modal-active'); }
        function logout() { sessionStorage.clear(); window.location.href = window.location.href.split('#')[0]; }
    </script>
</body>
</html>
