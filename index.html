<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davis Hub | التحكم المركزي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red-main: #ff4655; --blue-main: #3b82f6; --glass-bg: rgba(10, 10, 10, 0.8); }
        body { font-family: 'Cairo', sans-serif; background: #000; color: white; overflow-x: hidden; }
        
        /* تأثيرات الفخامة */
        .neon-border { border: 1px solid rgba(255, 70, 85, 0.2); transition: 0.3s; }
        .neon-border:hover { border-color: var(--red-main); box-shadow: 0 0 20px rgba(255, 70, 85, 0.1); }
        
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        
        .rank-card { transition: 0.3s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .rank-card:hover { background: rgba(255,255,255,0.05); }
        
        input[type="checkbox"]:checked + .rank-label { 
            background: linear-gradient(135deg, #ff4655 0%, #991b1b 100%); 
            color: white; border-color: transparent;
        }

        /* منع الدخول */
        .locked { filter: grayscale(1) blur(2px); cursor: not-allowed !important; opacity: 0.5; }
        
        /* Modal Animation */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-active { display: flex; animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <nav id="navbar" class="hidden p-6 glass-panel sticky top-0 z-50 flex justify-between items-center px-12 border-b border-red-500/20">
        <div class="flex items-center gap-6">
            <div class="relative">
                <img id="userAvatar" class="w-14 h-14 rounded-2xl object-cover border-2 border-red-500 shadow-[0_0_15px_rgba(255,70,85,0.4)]">
                <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-black"></div>
            </div>
            <div>
                <h2 id="userName" class="text-xl font-black tracking-tighter uppercase"></h2>
                <span class="text-[10px] bg-red-500/20 text-red-500 px-2 py-0.5 rounded font-bold">OPERATOR ACTIVE</span>
            </div>
        </div>
        <button onclick="logout()" class="hover:text-red-500 transition font-bold text-sm">LOGOUT EXIT</button>
    </nav>

    <section id="loginSection" class="h-screen flex items-center justify-center p-6 relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-red-900/20 via-black to-black"></div>
        <div class="glass-panel p-16 rounded-[60px] max-w-xl w-full text-center relative z-10 border-t-4 border-red-600">
            <h1 class="text-7xl font-black mb-4 tracking-[ -5px]">DAVIS<span class="text-red-600">.</span></h1>
            <p class="text-gray-400 mb-12 font-medium">نظام الربط المركزي للقطاعات الحكومية والعسكرية</p>
            <button onclick="discordLogin()" class="w-full bg-white text-black hover:bg-red-600 hover:text-white py-6 rounded-2xl font-black text-xl transition-all flex items-center justify-center gap-4 group">
                تسجيل الدخول عبر التوثيق
                <span class="group-hover:translate-x-2 transition-transform">→</span>
            </button>
        </div>
    </section>

    <section id="sectorSection" class="hidden min-h-screen p-12">
        <div class="max-w-7xl mx-auto">
            <div class="mb-16">
                <h3 class="text-5xl font-black tracking-tighter mb-2 italic">SECTOR SELECTOR</h3>
                <div class="h-1 w-32 bg-red-600"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <div id="card_red_crescent" onclick="enterSector('red_crescent', '1448772434940395621')" class="neon-border glass-panel p-10 rounded-[40px] relative overflow-hidden group cursor-pointer">
                    <div class="text-7xl mb-6 group-hover:scale-110 transition-transform">🚑</div>
                    <h4 class="text-2xl font-black mb-2">الهلال الأحمر</h4>
                    <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">Medical Support Unit</p>
                    <div id="lockIcon" class="absolute top-6 right-6 text-red-600 font-black">LOCKED</div>
                </div>

                <div class="locked glass-panel p-10 rounded-[40px]">
                    <div class="text-7xl mb-6">⚙️</div>
                    <h4 class="text-2xl font-black">كراج الميكانيك</h4>
                </div>
                <div class="locked glass-panel p-10 rounded-[40px]">
                    <div class="text-7xl mb-6">🛡️</div>
                    <h4 class="text-2xl font-black">الأمن العام</h4>
                </div>
                <div class="locked glass-panel p-10 rounded-[40px]">
                    <div class="text-7xl mb-6">🛰️</div>
                    <h4 class="text-2xl font-black">حرس الحدود</h4>
                </div>
            </div>
        </div>
    </section>

    <section id="redCrescentDashboard" class="hidden p-8 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <div class="glass-panel p-12 rounded-[50px] border-l-8 border-green-600">
                    <h3 class="text-3xl font-black mb-8 italic">MISSION LOGGING</h3>
                    <div class="grid grid-cols-2 gap-6">
                        <button onclick="sendLog('بداية المناوبة ⚡')" class="bg-green-600/10 hover:bg-green-600 text-green-500 hover:text-white py-12 rounded-[30px] font-black text-2xl transition-all shadow-xl shadow-green-900/10">حضور</button>
                        <button onclick="sendLog('نهاية المناوبة 🛑')" class="bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white py-12 rounded-[30px] font-black text-2xl transition-all shadow-xl shadow-red-900/10">انصراف</button>
                    </div>
                </div>
            </div>

            <div id="recruitmentPanel" class="hidden glass-panel p-8 rounded-[50px] border-t-8 border-blue-600 text-center flex flex-col items-center justify-center">
                <div class="w-24 h-24 bg-blue-600/20 rounded-full flex items-center justify-center text-5xl mb-6">📁</div>
                <h3 class="text-2xl font-black mb-2 uppercase">Recruitment</h3>
                <p class="text-sm text-gray-400 mb-8 px-4">لوحة إصدار قرارات التوظيف الرسمية وتعديل البيانات</p>
                <button onclick="openModal()" class="w-full bg-blue-600 hover:bg-white hover:text-black py-5 rounded-2xl font-black transition-all">فتح بوابة التوظيف</button>
            </div>
        </div>
    </section>

    <div id="recruitModal" class="modal-overlay">
        <div class="glass-panel w-full max-w-3xl p-10 rounded-[50px] max-h-[90vh] overflow-y-auto border-4 border-blue-600/30">
            <div class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
                <h2 class="text-4xl font-black tracking-tighter italic">NEW APPOINTMENT</h2>
                <button onclick="closeModal()" class="text-4xl hover:text-red-500">&times;</button>
            </div>

            <div class="space-y-8">
                <div>
                    <label class="block text-xs font-black text-blue-500 mb-4 uppercase tracking-[3px]">البحث عن الموظف (Discord ID / Username)</label>
                    <div class="relative">
                        <input type="text" id="targetDiscord" placeholder="ادخل معرف الديسكورد للشخص..." class="w-full bg-white/5 border border-white/10 p-6 rounded-3xl focus:outline-none focus:border-blue-500 font-bold transition-all">
                        <div class="absolute left-6 top-6 text-gray-500">🔍</div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-blue-500 mb-4 uppercase tracking-[3px]">الاسم الميداني المعتمد</label>
                    <input type="text" id="staffName" placeholder="مثال: سامر القحطاني" class="w-full bg-white/5 border border-white/10 p-6 rounded-3xl focus:outline-none focus:border-blue-500 font-bold transition-all">
                </div>

                <div>
                    <label class="block text-xs font-black text-blue-500 mb-4 uppercase tracking-[3px]">تحديد المسمى الوظيفي والرتب</label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="ranksList">
                        </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-blue-500 mb-4 uppercase tracking-[3px]">كود اللاعب (الرقم الوظيفي)</label>
                    <input type="text" id="playerID" placeholder="مثال: 505" class="w-full bg-white/5 border border-white/10 p-6 rounded-3xl focus:outline-none focus:border-blue-500 font-bold text-center text-2xl tracking-[10px]">
                </div>

                <button onclick="processRecruit()" class="w-full bg-blue-600 py-6 rounded-3xl font-black text-2xl shadow-[0_0_30px_rgba(59,130,246,0.3)] hover:scale-[1.02] transition-all">اعتماد التوظيف ونشر القرار 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            CLIENT_ID: '1385857180036632577',
            GUILD_ID: '1385853276485845084',
            WEBHOOKS: {
                LOGS: 'https://discordapp.com/api/webhooks/1455673493571113092/u1bo8mSUeVAKESMe1b2LYadcbiU0m9LEhgBrM9Vjl4qyq9qJRQozr_lqpcGpRZ7UzOfu',
                RECRUIT: 'https://discordapp.com/api/webhooks/1455674711110451358/BJiZOQ3b-butqHiOdyeKnjSPnKzjXhXzhKu5QOSlvPlHsnpQQuYFMJUh9-BB4TbI4iOc'
            },
            RANKS: [
                {id: "1448772434940395621", name: "إدارة الهلال"},
                {id: "1402752457796485233", name: "متدرب"},
                {id: "1402752591770943508", name: "مستوى 1"},
                {id: "1402752748289790094", name: "مستوى 2"},
                {id: "1402753188825927863", name: "مستوى 3"},
                {id: "1402753258799235164", name: "مستوى 4"},
                {id: "1402753361857609728", name: "مستوى 5"},
                {id: "1402753401678463096", name: "مستوى 6"},
                {id: "1402753452274225273", name: "مستوى 7"},
                {id: "1402753505642545422", name: "مستوى 8"},
                {id: "1402753555701432482", name: "مستوى 9"},
                {id: "1455659626174480568", name: "إشراف عام"},
                {id: "1455659784370917436", name: "إشراف ميداني"},
                {id: "1455665513286860820", name: "مسؤول توظيف"},
                {id: "1402753839517536288", name: "قائد الهلال"}
            ]
        };

        let userRoles = [];

        function discordLogin() {
            const uri = encodeURIComponent(window.location.href.split('#')[0]);
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.CLIENT_ID}&redirect_uri=${uri}&response_type=token&scope=identify+guilds.members.read`;
        }

        window.onload = async () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');
            
            if (token) {
                try {
                    // جلب بيانات العضو ورتبه
                    const res = await fetch(`https://discord.com/api/users/@me/guilds/${CONFIG.GUILD_ID}/member`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const data = await res.json();
                    
                    if (data.user) {
                        userRoles = data.roles || [];
                        sessionStorage.setItem('user', JSON.stringify(data.user));
                        renderApp();
                    } else {
                        alert("يجب أن تكون عضواً في السيرفر الرسمي للدخول!");
                        logout();
                    }
                } catch (e) {
                    alert("حدث خطأ في التحقق من الرتب.");
                }
            }
        };

        function renderApp() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('sectorSection').classList.remove('hidden');
            document.getElementById('userName').innerText = user.username;
            document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

            // فحص صلاحية الهلال الأحمر
            if (userRoles.includes("1448772434940395621") || userRoles.includes("1455665513286860820")) {
                document.getElementById('card_red_crescent').classList.remove('locked');
                document.getElementById('lockIcon').innerHTML = "✅ AUTHORIZED";
                document.getElementById('lockIcon').classList.replace('text-red-600', 'text-green-500');
            } else {
                document.getElementById('card_red_crescent').onclick = () => alert("❌ دخول ممنوع: لا تملك رتبة الإدارة");
            }
        }

        function enterSector(sector) {
            document.getElementById('sectorSection').classList.add('hidden');
            document.getElementById('redCrescentDashboard').classList.remove('hidden');
            
            // إظهار لوحة التوظيف للمسؤولين فقط
            if (userRoles.includes("1455665513286860820") || userRoles.includes("1448772434940395621")) {
                document.getElementById('recruitmentPanel').classList.remove('hidden');
            }
            
            const list = document.getElementById('ranksList');
            list.innerHTML = CONFIG.RANKS.map(r => `
                <div class="relative">
                    <input type="checkbox" id="r_${r.id}" value="${r.name}" data-id="${r.id}" class="hidden">
                    <label for="r_${r.id}" class="rank-label block p-4 border border-white/10 rounded-2xl text-[10px] font-bold text-center cursor-pointer hover:bg-white/5 transition-all">
                        ${r.name}
                    </label>
                </div>
            `).join('');
        }

        async function processRecruit() {
            const targetID = document.getElementById('targetDiscord').value;
            const staffName = document.getElementById('staffName').value;
            const playerID = document.getElementById('playerID').value;
            const selectedRanks = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            const admin = JSON.parse(sessionStorage.getItem('user'));

            if(!targetID || !staffName || !playerID) return alert("اكمل البيانات يا بطل!");

            const embed = {
                title: "📝 قرار توظيف رسمي - Davis System",
                color: 0x3b82f6,
                fields: [
                    { name: "👤 الموظف المستهدف (ID)", value: `\`${targetID}\``, inline: true },
                    { name: "📛 الاسم المعتمد", value: staffName, inline: true },
                    { name: "🔢 كود اللاعب", value: `\`${playerID}\``, inline: true },
                    { name: "🎖️ الرتب المستحقة", value: selectedRanks.join(" | "), inline: false },
                    { name: "⚙️ الإجراءات", value: `سيتم تغيير اللقب إلى: **${playerID} | ${staffName}**`, inline: false }
                ],
                footer: { text: `بواسطة المسؤول: ${admin.username}` },
                timestamp: new Date()
            };

            await fetch(CONFIG.WEBHOOKS.RECRUIT, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ embeds: [embed] })
            });

            alert("✅ تم إصدار القرار! في حال وجود Bot سيرفر، سيتم تعديل الرتب والاسم فوراً.");
            closeModal();
        }

        function openModal() { document.getElementById('recruitModal').classList.add('modal-active'); }
        function closeModal() { document.getElementById('recruitModal').classList.remove('modal-active'); }
        function logout() { sessionStorage.clear(); window.location.href = window.location.href.split('#')[0]; }
    </script>
</body>
</html>
