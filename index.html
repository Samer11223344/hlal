<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davis Hub | الإدارة والسيطرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red-main: #ff4655; --blue-main: #3b82f6; --glass-bg: rgba(10, 10, 10, 0.95); }
        body { font-family: 'Cairo', sans-serif; background: #000; color: white; overflow-x: hidden; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.05); }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-active { display: flex; animation: modalIn 0.3s ease-out; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        input[type="checkbox"]:checked + .rank-label { 
            background: #3b82f6; color: white; border-color: transparent;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <nav id="navbar" class="hidden p-6 glass-panel sticky top-0 z-50 flex justify-between items-center px-12 border-b border-blue-500/20">
        <div class="flex items-center gap-6">
            <img id="userAvatar" class="w-12 h-12 rounded-xl border-2 border-blue-500 shadow-lg shadow-blue-500/20">
            <div>
                <h2 id="userName" class="text-lg font-black tracking-tighter"></h2>
                <span class="text-[10px] text-blue-500 font-bold uppercase tracking-widest">Command Center</span>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="openStaffList()" class="bg-white/5 hover:bg-white/10 px-6 py-2 rounded-xl border border-white/10 text-sm font-bold transition">📋 قائمة الموظفين</button>
            <button onclick="logout()" class="text-red-500 text-sm font-bold">خروج</button>
        </div>
    </nav>

    <section id="loginSection" class="h-screen flex items-center justify-center p-6 relative">
        <div class="glass-panel p-16 rounded-[60px] max-w-xl w-full text-center border-t-4 border-blue-600">
            <h1 class="text-7xl font-black mb-4">DAVIS<span class="text-blue-600">.</span></h1>
            <p class="text-gray-400 mb-12 text-sm uppercase tracking-[5px]">Personnel Management System</p>
            <button onclick="discordLogin()" class="w-full bg-white text-black hover:bg-blue-600 hover:text-white py-6 rounded-3xl font-black text-xl transition-all">تسجيل الدخول للنظام</button>
        </div>
    </section>

    <section id="sectorSection" class="hidden min-h-screen p-12">
        <div class="max-w-7xl mx-auto">
            <h3 class="text-4xl font-black mb-12 italic border-r-4 border-blue-600 pr-4 uppercase">Sectors_</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div onclick="enterSector('red_crescent')" id="card_red_crescent" class="glass-panel p-10 rounded-[40px] border border-white/5 hover:border-blue-500 transition-all cursor-pointer group relative">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition-transform">🚑</div>
                    <h4 class="text-xl font-bold">الهلال الأحمر</h4>
                    <p class="text-[10px] text-gray-500 mt-2 italic" id="lockIcon">تحقق من الصلاحيات...</p>
                </div>
            </div>
        </div>
    </section>

    <section id="redCrescentDashboard" class="hidden p-12 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 glass-panel p-12 rounded-[50px] border-r-8 border-green-600">
                <h3 class="text-3xl font-black mb-8 italic uppercase">Shift Control_</h3>
                <div class="grid grid-cols-2 gap-6">
                    <button class="bg-green-600/10 hover:bg-green-600 text-green-500 hover:text-white py-12 rounded-3xl font-black text-2xl transition">حضور</button>
                    <button class="bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white py-12 rounded-3xl font-black text-2xl transition">انصراف</button>
                </div>
            </div>
            <div id="recruitmentPanel" class="hidden glass-panel p-12 rounded-[50px] border-t-8 border-blue-600 text-center">
                <div class="text-5xl mb-6">📁</div>
                <h3 class="text-xl font-black mb-6 uppercase italic">Staffing</h3>
                <button onclick="openModal()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold">إصدار قرار توظيف</button>
            </div>
        </div>
    </section>

    <div id="recruitModal" class="modal-overlay">
        <div class="glass-panel w-full max-w-4xl p-12 rounded-[50px] border border-blue-600/30">
            <div class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
                <h2 class="text-3xl font-black italic">NEW APPOINTMENT_</h2>
                <button onclick="closeModal()" class="text-3xl text-gray-500 hover:text-white">&times;</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-6">
                    <div class="flex gap-2">
                        <input type="text" id="targetDiscord" placeholder="Discord ID..." class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl focus:border-blue-500 outline-none font-bold">
                        <button onclick="searchUser()" class="bg-blue-600 px-6 rounded-xl font-bold">بحث</button>
                    </div>
                    <div id="userResult" class="hidden bg-blue-600/10 p-4 rounded-2xl flex items-center gap-4 border border-blue-500/20">
                        <img id="resAvatar" class="w-12 h-12 rounded-full border-2 border-blue-500">
                        <p id="resName" class="font-bold text-sm"></p>
                    </div>
                    <input type="text" id="staffName" placeholder="الاسم الميداني المعتمد..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none font-bold">
                    <input type="text" id="playerID" placeholder="كود اللاعب..." class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center text-2xl font-black tracking-widest outline-none">
                </div>
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-blue-500 tracking-[3px]">SELECT ROLE</p>
                    <div class="grid grid-cols-2 gap-2 h-64 overflow-y-auto pr-2" id="ranksList"></div>
                </div>
            </div>
            <button onclick="processRecruit()" id="confirmBtn" class="w-full mt-10 bg-blue-600 py-5 rounded-3xl font-black text-xl hover:bg-blue-500 transition shadow-xl shadow-blue-600/20">اعتماد التوظيف ونشر القرار 🚀</button>
        </div>
    </div>

    <div id="staffListModal" class="modal-overlay">
        <div class="glass-panel w-full max-w-5xl p-10 rounded-[50px] border border-white/10 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black italic uppercase">Personnel Database_</h2>
                <button onclick="closeStaffList()" class="text-3xl text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="text-[10px] text-blue-500 uppercase tracking-widest border-b border-white/5">
                            <th class="p-4">الموظف</th>
                            <th class="p-4">الكود</th>
                            <th class="p-4">الرتبة المعينة</th>
                            <th class="p-4">حالة الاتصال</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            CLIENT_ID: '1385857180036632577',
            GUILD_ID: '1385853276485845084',
            BOT_TOKEN: 'MTM4NTg1NzE4MDAzNjYzMjU3Nw.G-dhyh.gSAE58akzsp4waaNGlNeYpEZxDUfjyNVmGAsXk', 
            WEBHOOKS: {
                RECRUIT: 'https://discordapp.com/api/webhooks/1455674711110451358/BJiZOQ3b-butqHiOdyeKnjSPnKzjXhXzhKu5QOSlvPlHsnpQQuYFMJUh9-BB4TbI4iOc'
            },
            RANKS: [
                {id: "1448772434940395621", name: "إدارة الهلال"},
                {id: "1402752457796485233", name: "متدرب"},
                {id: "1402752591770943508", name: "مستوى 1"},
                {id: "1455665513286860820", name: "مسؤول توظيف"},
                {id: "1402753839517536288", name: "قائد الهلال"}
                // يمكنك إضافة البقية هنا بنفس النمط
            ]
        };

        let userRoles = [];
        let staffDatabase = JSON.parse(localStorage.getItem('staffDB')) || [];

        function discordLogin() {
            const uri = encodeURIComponent(window.location.href.split('#')[0]);
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.CLIENT_ID}&redirect_uri=${uri}&response_type=token&scope=identify+guilds.members.read`;
        }

        window.onload = async () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');
            if (token) {
                const res = await fetch(`https://discord.com/api/users/@me/guilds/${CONFIG.GUILD_ID}/member`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.user) {
                    userRoles = data.roles || [];
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    renderApp();
                }
            }
        };

        function renderApp() {
            const user = JSON.parse(sessionStorage.getItem('user'));
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('navbar').classList.remove('hidden');
            document.getElementById('sectorSection').classList.remove('hidden');
            document.getElementById('userName').innerText = user.username;
            document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

            if (userRoles.includes("1448772434940395621") || userRoles.includes("1455665513286860820")) {
                document.getElementById('card_red_crescent').classList.remove('opacity-20');
                document.getElementById('lockIcon').innerHTML = "تم منح الوصول ✅";
                document.getElementById('lockIcon').classList.add('text-green-500');
            }
        }

        async function searchUser() {
            const id = document.getElementById('targetDiscord').value;
            const res = await fetch(`https://discord.com/api/guilds/${CONFIG.GUILD_ID}/members/${id}`, {
                headers: { Authorization: `Bot ${CONFIG.BOT_TOKEN}` }
            });
            const data = await res.json();
            if (data.user) {
                document.getElementById('userResult').classList.remove('hidden');
                document.getElementById('resName').innerText = data.user.username;
                document.getElementById('resAvatar').src = `https://cdn.discordapp.com/avatars/${data.user.id}/${data.user.avatar}.png`;
            } else {
                alert("اللاعب غير موجود في السيرفر!");
            }
        }

        function enterSector(sector) {
            document.getElementById('sectorSection').classList.add('hidden');
            document.getElementById('redCrescentDashboard').classList.remove('hidden');
            if (userRoles.includes("1455665513286860820") || userRoles.includes("1448772434940395621")) {
                document.getElementById('recruitmentPanel').classList.remove('hidden');
            }
            document.getElementById('ranksList').innerHTML = CONFIG.RANKS.map(r => `
                <div class="relative">
                    <input type="checkbox" id="r_${r.id}" value="${r.name}" data-id="${r.id}" class="hidden rank-cb">
                    <label for="r_${r.id}" class="rank-label block p-3 border border-white/10 rounded-xl text-[11px] font-bold text-center cursor-pointer hover:bg-white/5 transition-all">
                        ${r.name}
                    </label>
                </div>
            `).join('');
        }

        async function processRecruit() {
            const id = document.getElementById('targetDiscord').value;
            const name = document.getElementById('staffName').value;
            const code = document.getElementById('playerID').value;
            const rankId = document.querySelector('.rank-cb:checked')?.getAttribute('data-id');
            const rankName = document.querySelector('.rank-cb:checked')?.value;

            if(!id || !name || !code || !rankId) return alert("اكمل البيانات يا بطل!");

            // ديسكورد: تحديث رتب واسم
            const newNick = `${code} | ${name}`;
            await fetch(`https://discord.com/api/guilds/${CONFIG.GUILD_ID}/members/${id}`, {
                method: 'PATCH',
                headers: { Authorization: `Bot ${CONFIG.BOT_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ nick: newNick, roles: [rankId] })
            });

            // إضافة للقاعدة المحلية
            const newEntry = { id, name, code, rank: rankName, date: new Date().toLocaleDateString() };
            staffDatabase.push(newEntry);
            localStorage.setItem('staffDB', JSON.stringify(staffDatabase));

            // إرسال الويبهوك
            await fetch(CONFIG.WEBHOOKS.RECRUIT, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ embeds: [{
                    title: "📝 تعيين موظف جديد",
                    fields: [
                        { name: "الموظف", value: `<@${id}>`, inline: true },
                        { name: "الكود", value: code, inline: true },
                        { name: "الرتبة", value: rankName, inline: true }
                    ],
                    color: 0x3b82f6
                }]})
            });

            alert("✅ تم التوظيف بنجاح!");
            closeModal();
            openStaffList();
        }

        async function openStaffList() {
            document.getElementById('staffListModal').classList.add('modal-active');
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '<p class="p-6 text-gray-500">جاري فحص حالة الاتصال...</p>';

            let rows = "";
            for (const staff of staffDatabase) {
                // فحص الحالة من ديسكورد
                const res = await fetch(`https://discord.com/api/guilds/${CONFIG.GUILD_ID}/members/${staff.id}`, {
                    headers: { Authorization: `Bot ${CONFIG.BOT_TOKEN}` }
                });
                const isOnline = res.status === 200;

                rows += `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition">
                        <td class="p-4 font-bold text-sm text-gray-300">${staff.name}</td>
                        <td class="p-4 font-mono text-blue-500 font-black">${staff.code}</td>
                        <td class="p-4"><span class="bg-blue-600/20 text-blue-500 px-3 py-1 rounded-lg text-[10px] font-bold">${staff.rank}</span></td>
                        <td class="p-4">
                            <span class="flex items-center gap-2 text-[11px] font-bold ${isOnline ? 'text-green-500' : 'text-red-600'}">
                                <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-green-500 animate-pulse' : 'bg-red-600'}"></span>
                                ${isOnline ? 'متصل بالديسكورد' : 'غير متصل'}
                            </span>
                        </td>
                    </tr>
                `;
            }
            tbody.innerHTML = rows || '<tr><td colspan="4" class="p-10 text-center text-gray-500">لا يوجد موظفين مسجلين حالياً</td></tr>';
        }

        function closeStaffList() { document.getElementById('staffListModal').classList.remove('modal-active'); }
        function openModal() { document.getElementById('recruitModal').classList.add('modal-active'); }
        function closeModal() { document.getElementById('recruitModal').classList.remove('modal-active'); }
        function logout() { sessionStorage.clear(); window.location.href = window.location.href.split('#')[0]; }
    </script>
</body>
</html>
