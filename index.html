<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الهلال الأحمر | Davis Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .red-gradient { background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="loginSection" class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-red-600/20 mb-4">
                <span class="text-4xl">🚑</span>
            </div>
            <h2 class="text-2xl font-bold">بوابة موظفي الهلال الأحمر</h2>
            <p class="text-gray-400 text-sm mt-2">يرجى تسجيل الدخول والتحقق من الكود</p>
        </div>

        <button onclick="discordLogin()" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white py-3 rounded-xl font-bold mb-4 flex items-center justify-center transition-all">
            <span>تسجيل الدخول عبر الديسكورد</span>
        </button>

        <div class="space-y-4">
            <label class="block text-sm text-gray-400">رمز الدخول العسكري</label>
            <input type="password" id="staffCode" placeholder="•••••" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-center text-xl tracking-widest focus:outline-none focus:border-red-500">
            <button onclick="checkAccess()" class="w-full red-gradient py-3 rounded-xl font-bold hover:opacity-90 transition-all">دخول المنصة</button>
        </div>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-2xl border-r-4 border-green-500">
                <h3 class="text-xl font-bold mb-4">دفتر الحضور</h3>
                <p class="text-gray-400 text-sm mb-6">اضغط لتسجيل دخولك في المناوبة الحالية</p>
                <button onclick="sendPresence('حضور ✅')" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-xl font-bold transition-all">تسجيل حضور</button>
                <button onclick="sendPresence('انصراف ❌')" class="w-full mt-2 border border-red-500/50 hover:bg-red-500/20 py-3 rounded-xl font-bold transition-all">تسجيل انصراف</button>
            </div>

            <div id="adminPanel" class="glass p-6 rounded-2xl border-r-4 border-blue-500 opacity-50 pointer-events-none">
                <h3 class="text-xl font-bold mb-4">إدارة الموظفين (رتبة مسؤول)</h3>
                <button onclick="openAddStaff()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">إضافة موظف جديد</button>
                <p class="text-[10px] mt-2 text-center text-red-400">خاص برتبة مسؤول التوظيف فقط</p>
            </div>
        </div>

        <div class="glass rounded-2xl overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-white/10">
                    <tr>
                        <th class="p-4">الموظف</th>
                        <th class="p-4">الرتبة</th>
                        <th class="p-4">الحالة بالديسكورد</th>
                    </tr>
                </thead>
                <tbody id="staffTable">
                    <tr class="border-t border-white/5">
                        <td class="p-4">سامر القحطاني</td>
                        <td class="p-4"><span class="bg-red-500/20 text-red-500 px-3 py-1 rounded text-xs">مدير القطاع</span></td>
                        <td class="p-4 text-green-400">● متصل</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'رابط_الويب_هوك_هنا'; // ضع رابط الديسكورد هنا

        function checkAccess() {
            const code = document.getElementById('staffCode').value;
            if(code === "11011") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                alert('مرحباً بك في نظام الهلال الأحمر');
            } else {
                alert('الرمز خاطئ، يرجى المحاولة مرة أخرى');
            }
        }

        async function sendPresence(status) {
            // ملاحظة: هنا نحتاج اسم اللاعب من الديسكورد بعد الربط
            const playerName = "موظف هلال أحمر"; 
            
            const data = {
                content: null,
                embeds: [{
                    title: `سجل الحضور - الهلال الأحمر`,
                    description: `قام الموظف **${playerName}** بتسجيل **${status}**`,
                    color: status.includes('حضور') ? 65280 : 16711680,
                    timestamp: new Date()
                }]
            };

            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('تم إرسال سجل الحضور للديسكورد');
        }

        // هذه الدالة لتفعيل لوحة المسؤول إذا كانت رتبته بالديسكورد تسمح
        // في نظام الـ JS البسيط، يمكننا جعلها تفتح بكلمة سر أخرى أو ربط API
        function unlockAdmin() {
            document.getElementById('adminPanel').classList.remove('opacity-50', 'pointer-events-none');
        }
    </script>
</body>
</html>
